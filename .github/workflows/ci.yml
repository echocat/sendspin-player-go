name: Continuous Integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Full validation or native desktop diagnostics only (not full CI)
        type: choice
        default: full
        options: [full, native-desktop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    if: inputs.scope != 'native-desktop'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.27.3', 'stable']
    runs-on: ${{ matrix.os }}
    env:
      SENDSPIN_EVIDENCE_VARIANT: ${{ matrix.go == 'stable' && 'stable' || 'default' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
      - name: Prepare coverage output
        run: |
          mkdir -p var/coverage
          printf '%s\n' 'module github.com/echocat/sendspin-player-go/var' > var/go.mod
        shell: bash
      - run: go run ./internal/specauditcmd run --suite unit --coverage
      - run: go mod tidy -diff
      - name: Record CGO-free example tests
        run: go run ./internal/specauditcmd run --suite examples
      - name: Test the ALSA unavailable-platform stub without CGO or hardware
        working-directory: audio/alsa
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 ./...
      - name: Test direct desktop outputs without CGO or hardware
        working-directory: audio/native
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 ./...
      - name: Build the Oto-only example without CGO
        working-directory: _examples/player
        env:
          CGO_ENABLED: '0'
        run: |
          go build -o ../../var/bin/oto/ .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: spec-evidence-go-${{ matrix.os }}-${{ matrix.go }}-attempt-${{ github.run_attempt }}
          path: var/audit/evidence
          if-no-files-found: warn
  e2e:
    if: inputs.scope != 'native-desktop'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: mise run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: spec-evidence-e2e-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: var/audit/evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resource-soak-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: var/soak
          if-no-files-found: warn
  quality:
    if: inputs.scope != 'native-desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: mise run vuln
      - run: mise run test:fuzz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: spec-evidence-fuzz-attempt-${{ github.run_attempt }}
          path: var/audit/evidence
          if-no-files-found: warn
  lint:
    if: inputs.scope != 'native-desktop'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: mise run lint
  mdns:
    if: inputs.scope != 'native-desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: mise run test:mdns:docker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: spec-evidence-mdns-attempt-${{ github.run_attempt }}
          path: var/audit/evidence
          if-no-files-found: warn
  conformance:
    if: inputs.scope != 'native-desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: mise run test:conformance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: spec-evidence-harness-attempt-${{ github.run_attempt }}
          path: |
            var/audit/evidence
            var/conformance
          if-no-files-found: warn
  time-filter-reference:
    if: inputs.scope != 'native-desktop'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SENDSPIN_REFERENCE_UBSAN: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - run: go run ./internal/specauditcmd run --suite reference
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: spec-evidence-reference-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: var/audit/evidence
          if-no-files-found: warn
  native-build:
    if: inputs.scope != 'native-desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - run: mise run lint:native
      - run: mise run test:native
      - run: mise run build:example
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: spec-evidence-native-attempt-${{ github.run_attempt }}
          path: var/audit/evidence
          if-no-files-found: warn
  alsa:
    if: inputs.scope != 'native-desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: mise run lint:alsa
      - run: mise run test:alsa
      - run: go run ./internal/specauditcmd report --profile alsa --output var/audit/alsa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: spec-evidence-alsa-attempt-${{ github.run_attempt }}
          path: |
            var/audit/evidence
            var/audit/alsa
          if-no-files-found: warn
  desktop-audio:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev pipewire-bin libpipewire-0.3-modules libspa-0.2-modules
      - run: mise run lint:desktop-audio
      - run: mise run test:desktop-audio
      - if: runner.os == 'Linux'
        run: mise run test:pipewire:isolated
      - run: go run ./internal/specauditcmd report --profile desktop-audio --output var/audit/desktop-audio
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: spec-evidence-desktop-audio-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            var/audit/evidence
            var/audit/desktop-audio
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'Linux'
        with:
          name: native-desktop-private-pipewire-attempt-${{ github.run_attempt }}
          path: var/platform-validation/native-desktop/pipewire
          if-no-files-found: warn
  spec-report:
    name: RC1 traceability (not certification)
    if: always() && inputs.scope != 'native-desktop'
    needs: [go, e2e, quality, lint, mdns, conformance, time-filter-reference, native-build, alsa, desktop-audio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: spec-evidence-*-attempt-${{ github.run_attempt }}
          path: var/audit/ci
      - name: Validate catalog and pinned upstream source fingerprints
        if: always()
        run: |
          mise run lint:audit
          mise run audit:verify-spec
          mise run audit:verify-noise
          mise run audit:verify-mdns
      - name: Generate and gate the pinned Linux software-evidence report
        if: always()
        run: go run ./internal/specauditcmd report --profile full --evidence var/audit/ci --goos linux --goarch amd64 --go-version go1.27.3
      - name: Generate and gate native build/callback evidence (not physical measurements)
        if: always()
        run: go run ./internal/specauditcmd report --profile native --evidence var/audit/ci --output var/audit/native --goos linux --goarch amd64 --go-version go1.27.3
      - name: Gate separate Linux ALSA ABI/fake-device evidence (no physical measurements)
        if: always()
        run: go run ./internal/specauditcmd report --profile alsa --evidence var/audit/ci --output var/audit/alsa --goos linux --goarch amd64 --go-version go1.27.3
      - name: Gate separate direct desktop clock/callback evidence (no physical measurements)
        if: always()
        run: go run ./internal/specauditcmd report --profile desktop-audio --evidence var/audit/ci --output var/audit/desktop-audio --goos linux --goarch amd64 --go-version go1.27.3
      - name: Publish traceability summary
        if: always()
        shell: bash
        run: |
          if [ -f var/audit/summary.md ]; then
            cat var/audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc1-traceability-report-attempt-${{ github.run_attempt }}
          path: |
            var/audit/report.json
            var/audit/report.md
            var/audit/summary.md
            var/audit/native
            var/audit/alsa
            var/audit/desktop-audio
          if-no-files-found: warn
