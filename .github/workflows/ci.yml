name: Continuous Integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go:
          - version: '1.27.3'
            mise-env: ci-minimum
          - version: stable
            mise-env: ci-stable
    runs-on: ${{ matrix.os }}
    env:
      MISE_ENV: ${{ matrix.go.mise-env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Ordinary Go tests, with race detection and coverage
        run: mise run test --race --coverage -- -json
      - name: Ordinary Go tests without CGO
        env:
          CGO_ENABLED: '0'
        run: mise run test
      - run: mise run lint:go:mod
      - name: Build the offline WAV tool without CGO
        run: mise run build:loopback
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-coverage-${{ matrix.os }}-${{ matrix.go.version }}
          path: profile.cov
          if-no-files-found: warn
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SENDSPIN_TEST_PLAYBACK_DEVICE: ''
      SENDSPIN_TEST_CAPTURE_DEVICE: ''
      SENDSPIN_REFERENCE_UBSAN: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Install optional Linux native runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pipewire-bin libpipewire-0.3-modules libspa-0.2-modules libasound2t64
      - name: E2E Go tests (TestMain owns fixtures; no physical devices)
        run: mise run test:e2e -- -json
  desktop-audio:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
      SENDSPIN_TEST_PLAYBACK_DEVICE: ''
      SENDSPIN_TEST_CAPTURE_DEVICE: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Install optional Linux native runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pipewire-bin libpipewire-0.3-modules libspa-0.2-modules libasound2t64
      - name: Native ABI and fake-device unit tests
        run: mise run test:native
      - name: Native backend E2E architecture checks (physical devices visibly skipped)
        run: mise run test:native:e2e -- -json
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run lint
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Reachable dependency vulnerabilities and bounded Go fuzz tests
        run: >-
          mise run vuln ::: test:fuzz
  source-pins:
    name: Pinned sources (not conformance certification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: >-
          mise run lint:audit ::: audit:verify-spec ::: audit:verify-noise ::: audit:verify-mdns
