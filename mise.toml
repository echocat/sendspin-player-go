#:schema https://mise.jdx.dev/schema/mise.json
[settings]
lockfile = true

[tools]
go = "1.27.3"
uv = "0.12.13"

[task_templates.go_test]
usage = '''
flag "--race" help="Enable the Go race detector" default=#false
flag "--coverage" help="Collect atomic Go coverage with the race detector" default=#false
arg "[args]..." double_dash="required" help="Additional go test arguments"
'''
vars.go_test_flags = ""
vars.go_test_packages = "./..."
vars.go_test_binary_args = ""
vars.go_test_coverprofile = "profile.cov"
shell = "{% if os() == 'windows' %}pwsh -Command{% else %}sh -o errexit -c{% endif %}"
run = '''
go test -count=1 {{vars.go_test_flags}} {% if usage.race or usage.coverage %}-race {% endif %}{% if usage.coverage %}-covermode=atomic "-coverprofile={{vars.go_test_coverprofile}}" {% endif %}{{vars.go_test_packages}} {% for arg in usage.args | default(value=[]) %}{% if os() == 'windows' %}'{{arg | replace(from="'", to="''")}}'{% else %}{{arg | quote}}{% endif %} {% endfor %}{{vars.go_test_binary_args}}{% if os() == 'windows' %}; exit $LASTEXITCODE{% endif %}
'''

[tasks.test]
extends = "go_test"
description = "Run ordinary Go tests in the SDK and independent example modules"
depends = ["test:examples"]

[tasks."test:go"]
extends = "go_test"
description = "Run ordinary SDK Go tests"

[tasks."test:examples"]
description = "Discover and test every independent example module"
run = 'go test -count=1 ./internal/integration -run="^TestExamples$" -args -examples=test'

[tasks."test:e2e"]
extends = "go_test"
description = "Run only E2E Go tests; package TestMain owns setup and cleanup"
vars.go_test_flags = "-tags=e2e -run=E2E -timeout=20m"
vars.go_test_coverprofile = "profile.e2e.cov"

[tasks."test:native"]
extends = "go_test"
description = "Run native audio ABI and fake-device tests without services or hardware"
vars.go_test_packages = "./audio/..."
vars.go_test_coverprofile = "profile.native.cov"

[tasks."test:native:e2e"]
extends = "go_test"
description = "Run native backend E2E architecture checks without Python fixture packages"
vars.go_test_flags = "-tags=e2e -run=E2E -timeout=5m"
vars.go_test_packages = "./audio/native/... ./audio/pipewire/... ./audio/alsa/... ./audio/coreaudio/... ./audio/wasapi/..."
vars.go_test_coverprofile = "profile.native.e2e.cov"

[tasks."test:fuzz"]
description = "Run every bounded fuzz target with two workers per invocation"
run = [
    'go test -run="^$" -fuzz="^FuzzVisualizerStream$" -fuzztime=5s -parallel=2 .',
    'go test -run="^$" -fuzz="^FuzzMetadataPosition$" -fuzztime=5s -parallel=2 .',
    'go test -run="^$" -fuzz="^FuzzControlModels$" -fuzztime=5s -parallel=2 .',
    'go test -run="^$" -fuzz="^FuzzActivationIgnoredPairingField$" -fuzztime=5s -parallel=2 .',
    'go test -run="^$" -fuzz="^FuzzPairingToken$" -fuzztime=5s -parallel=2 .',
    'go test -run="^$" -fuzz="^FuzzRoleBinaryMessages$" -fuzztime=5s -parallel=2 .',
    'go test -run="^$" -fuzz="^FuzzPCM$" -fuzztime=5s -parallel=2 ./codec',
    'go test -run="^$" -fuzz="^FuzzSample$" -fuzztime=5s -parallel=2 ./internal/timesync',
    'go test -run="^$" -fuzz="^FuzzWireBase64URL$" -fuzztime=5s -parallel=2 ./internal/wire',
    'go test -run="^$" -fuzz="^FuzzLanguageTag$" -fuzztime=5s -parallel=2 ./internal/protocol',
    'go test -run="^$" -fuzz="^FuzzTypedDecode$" -fuzztime=5s -parallel=2 ./internal/protocol',
    'go test -run="^$" -fuzz="^FuzzParse$" -fuzztime=5s -parallel=2 ./internal/protocol',
    'go test -run="^$" -fuzz="^FuzzFragments$" -fuzztime=5s -parallel=2 ./internal/protocol',
]

[tasks."example:run"]
description = "Run a discovered example and forward its arguments unchanged"
alias = "example"
raw_args = true
run = "go run ./internal/examplecmd run"

[tasks."example:list"]
description = "List discovered example modules"
alias = "example:ls"
raw_args = true
run = "go run ./internal/examplecmd list"

[tasks.format]
description = "Format and tidy the SDK and independent example modules"
depends = ["format:go", "format:examples", "format:audit"]

[tasks."format:go"]
description = "Format SDK Go sources and tidy its dependencies"
tools.golangci-lint = "2.15.0"
run = ["golangci-lint fmt ./...", "go mod tidy"]

[tasks."format:examples"]
description = "Format and tidy the independent example modules"
tools.golangci-lint = "2.15.0"
run = "go run ./internal/examplecmd format"

[tasks."format:audit"]
description = "Regenerate the human RC1 audit from the requirement catalog"
depends = ["format:go", "format:examples"]
run = "go run ./internal/specauditcmd generate"

[tasks."format:check"]
description = "Check Go formatting without changing files"
depends = ["lint:go:format", "lint:examples:format"]

[tasks.lint]
description = "Lint Go sources, module files, CI workflows and test mappings"
depends = ["lint:go", "lint:examples", "lint:actions", "lint:audit"]

[tasks."lint:go"]
depends = ["lint:go:format", "lint:go:mod", "lint:go:tagged"]
tools.golangci-lint = "2.15.0"
run = "golangci-lint run"

[tasks."lint:go:format"]
tools.golangci-lint = "2.15.0"
run = "golangci-lint fmt --diff ./..."

[tasks."lint:go:mod"]
run = "go mod tidy -diff"

[tasks."lint:go:tagged"]
description = "Lint the same E2E sources selected by go test -tags=e2e"
tools.golangci-lint = "2.15.0"
run = "golangci-lint run --build-tags=e2e"

[tasks."lint:examples"]
description = "Check formatting, modules, vet and lint in every discovered example"
tools.golangci-lint = "2.15.0"
env.CGO_ENABLED = "0"
run = 'go test -count=1 ./internal/integration -run="^TestExamples$" -args -examples=code'

[tasks."lint:examples:format"]
tools.golangci-lint = "2.15.0"
run = "go run ./internal/examplecmd check"

[tasks."lint:actions"]
tools.actionlint = "1.7.12"
run = "actionlint -shellcheck="

[tasks."lint:audit"]
run = "go run ./internal/specauditcmd check"

[tasks."build:examples"]
description = "Build discovered example executables under var/bin/examples without CGO"
alias = "build:example"
env.CGO_ENABLED = "0"
run = "go run ./internal/examplecmd build"

[tasks."build:loopback"]
description = "Build the offline WAV tool without opening audio devices"
env.CGO_ENABLED = "0"
run = 'go build -o "{{config_root}}/var/bin/loopback/loopback" ./internal/loopbackcmd'
run_windows = 'go build -o "{{config_root}}/var/bin/loopback/loopback.exe" ./internal/loopbackcmd'

[tasks."audit:report"]
description = "Generate traceability without treating unrun or stale evidence as a pass"
run = "go run ./internal/specauditcmd report"

[tasks."audit:verify-spec"]
run = "go run ./internal/specauditcmd verify-spec"

[tasks."audit:verify-noise"]
run = "go run ./internal/noisevectorcmd"

[tasks."audit:verify-mdns"]
run = "go run ./internal/mdnsimportcmd"

[tasks."audit:check-conformance"]
description = "Strict conformance gate; still blocked by outstanding review and hardware evidence"
run = "go run ./internal/specauditcmd report --profile full --require-conformance"

[tasks.vuln]
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks."check:full"]
description = "Run lint, ordinary Go tests, E2E Go tests, bounded fuzzing and vulnerability checks"
depends = ["lint", "test", "test:e2e", "test:fuzz", "vuln"]
